<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperToConcept - Question PDF to Worked Solutions</title>
<meta name="description" content="Upload a question paper PDF, get a solutions PDF with concepts, theory, steps and honest flags.">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
</head>
<body>
<header class="site-header">
  <h1>Paper<span>To</span>Concept</h1>
  <p class="tagline">Question paper in. Worked solutions out.</p>
</header>

<main>
  <section id="setup" class="card">
    <h2>1. Setup</h2>
    <label class="field">
      <span>Gemini API key</span>
      <div class="keyrow">
        <input type="password" id="apiKey" placeholder="Paste your AI Studio API key" autocomplete="off">
        <button id="toggleKey" type="button" class="ghost" title="Show/hide key">&#128065;</button>
      </div>
      <label class="checkrow">
        <input type="checkbox" id="rememberKey">
        <span>Remember key in this browser (stored in local storage; anyone using this browser can use it)</span>
      </label>
      <small>Get a key in <a href="https://aistudio.google.com/" target="_blank" rel="noopener">Google AI Studio</a>.
      Sent only to Google's Gemini API, never anywhere else. Not saved unless you tick "remember".
      Costs depend on YOUR Google project: a free-tier project is not charged, but if billing is
      enabled on your project, Google's charges apply. Check your tier and limits in AI Studio.</small>
    </label>
    <label class="field">
      <span>Model</span>
      <select id="model">
        <option value="gemini-3.8-flash" selected>gemini-3.8-flash (best quality)</option>
        <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (faster, higher free quota)</option>
        <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite (faster, higher free quota)</option>
      </select>
    </label>
    <label class="field">
      <span>Paper title (shown on the PDF cover line)</span>
      <input type="text" id="paperTitle" placeholder="e.g. JEE Main 2024 - 27 Jan Shift 1">
    </label>
  </section>

  <section id="upload" class="card">
    <h2>2. Upload PDF</h2>
    <div id="dropzone" class="dropzone">
      <p>Drop your question paper PDF here or</p>
      <button id="pickFile" type="button">Choose PDF</button>
      <input type="file" id="fileInput" accept="application/pdf" hidden>
    </div>
    <div id="fileInfo" class="fileinfo hidden"></div>
    <label class="checkrow">
      <input type="checkbox" id="hasAnswers">
      <span>This PDF includes an answer key / correct options (they will be cross-checked, not copied blindly)</span>
    </label>
  </section>

  <section id="run" class="card">
    <h2>3. Generate</h2>
    <div class="btnrow">
      <button id="startBtn" type="button" class="primary">Start</button>
      <button id="resumeBtn" type="button" class="hidden">Resume saved run</button>
      <button id="clearBtn" type="button" class="ghost hidden">Discard saved run</button>
    </div>
    <div class="progresswrap hidden" id="progressWrap">
      <div class="progressbar"><div id="progressFill"></div></div>
      <div id="progressText">Idle</div>
    </div>
    <ol id="log" class="log"></ol>
  </section>

  <section id="result" class="card hidden">
    <h2>4. Result</h2>
    <div class="btnrow">
      <button id="downloadBtn" type="button" class="primary">Download solutions PDF</button>
      <button id="previewBtn" type="button">Toggle preview</button>
    </div>
    <div id="flagsSummary"></div>
    <div id="preview" class="preview hidden"></div>
  </section>

  <!-- hidden render target for PDF export -->
  <div id="exportRoot" class="exportroot" aria-hidden="true"></div>
</main>

<footer>
  <p>Your key and PDF never leave your browser except to Google's Gemini API.
  AI solutions can be wrong - flagged answers need a human check.</p>
</footer>

<script src="app.js?v=2" type="module"></script>
</body>
</html>
